# /etc/iot-gateway/firmware.conf
# ─────────────────────────────────────────────────────────────────────────────
# IoT Gateway firmware OTA configuration.
# Read by main.cpp (firmwareUpdateThread) and https_server.cpp (/fw-check).
# Format: KEY=value   (one per line, # comments allowed, no spaces around =)
# ─────────────────────────────────────────────────────────────────────────────

# ── Blockchain ────────────────────────────────────────────────────────────────
# FirmwareMetadataStore contract address (required — OTA disabled if empty)
FIRMWARE_CONTRACT=0x5FbDB2315678afecb367f032d93F642f64180aa3

# ── HSM signature verification ────────────────────────────────────────────────
# GCP KMS RSA-PSS public key PEM (used to verify the RPIS tail in the .ldr)
# Export once from GCP: gcloud kms keys versions get-public-key 1 \
#   --keyring=firmware-signing --location=global --key=firmware-key \
#   --output-file=/etc/googlehsmkey/hsm-pubkey.pem
FIRMWARE_HSM_PUBKEY=/etc/googlehsmkey/hsm-pubkey.pem

# ── TLS / HTTPS download ──────────────────────────────────────────────────────
# CA bundle for verifying the GitHub Releases HTTPS download URL
FIRMWARE_CA_CERT=/etc/ssl/certs/ca-certificates.crt

# ── File paths ────────────────────────────────────────────────────────────────
# Running binary to replace on successful update
FIRMWARE_TARGET=/usr/bin/iot-gateway

# Temporary download location (must have enough space for the .ldr)
FIRMWARE_STAGING=/tmp/iot-gateway.staging

# Rollback backup of the previous binary
FIRMWARE_BACKUP=/usr/bin/iot-gateway.bak

# ── Polling interval ─────────────────────────────────────────────────────────
# How often (seconds) the firmware thread polls the blockchain for a new version
# 3600 = 1 hour  |  300 = 5 min (for testing)
FIRMWARE_CHECK_INTERVAL=3600
